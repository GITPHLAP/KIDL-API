version: "2"
sql:
- engine: "postgresql"
  gen:
    go: 
      package: "db"
      sql_package: "pgx/v5"
      out: "./"
      emit_json_tags: true
      json_tags_case_style: "camel"
  schema: 
  - "transactions/schema.sql"
  - "transactions_view/schema.sql"
  - "transaction_categories/schema.sql"
  - "transaction_categories_mapping/schema.sql"
  - "forecasts/schema.sql"
  - "monthly_overview_by_category/schema.sql"
  queries: 
  - "transactions/queries.sql"
  - "transactions_view/queries.sql"
  - "transaction_categories/queries.sql"
  - "transaction_categories_mapping/queries.sql"
  - "forecasts/queries.sql"
  - "monthly_overview_by_category/queries.sql"
  