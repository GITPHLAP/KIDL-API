info:
  contact: {}
paths:
  /health_check:
    get:
      description: return the API image version
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.HealthCheckReturn'
      summary: Endpoint to check if API is up and running
  /overview/template/{year}/{type}:
    get:
      consumes:
      - application/json
      description: get data by year and type
      parameters:
      - description: Year
        in: path
        name: year
        required: true
        type: integer
      - description: Type
        enum:
        - expenses
        - income
        in: path
        name: type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.ResponseData'
            - properties:
                data:
                  $ref: '#/definitions/db.YearlyOverviewByCategory'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ResponseError'
      summary: Get data for the Nordea template
      tags:
      - accounts
swagger: "2.0"
