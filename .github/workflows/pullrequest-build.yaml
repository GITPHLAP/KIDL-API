name: Pull request build test

on:
  workflow_dispatch:
  pull_request:
      branches:
        - '**'
        - '!dependabot/**'
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  build:
    name: build docker image and test it
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.USER_TOKEN }}

      - name: set lower case repo
        run: |
          echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >>${GITHUB_ENV}
      # Initialize and configure Docker Buildx, a modern building toolkit.
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4
        # Authenticate against the specified container registry
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and export to registry
        uses: docker/build-push-action@v6
        with:
          load: true
          tags: "${{ env.IMAGE_NAME_LC }}:test"