version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    allow:
      - dependency-type: "all"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    allow:
      - dependency-type: "all"
    open-pull-requests-limit: 12
    groups:
      gomod-dependencies:
        patterns: 
          - "*"
